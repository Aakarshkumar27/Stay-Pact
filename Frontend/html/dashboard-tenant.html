<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenant Dashboard | StayPact</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboards.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-logo">
        <div class="logo-symbol"><i class="fa-solid fa-handshake-simple"></i></div>
        <span class="logo-text">Stay<span class="logo-highlight">Pact</span></span>
      </a>

      <div class="nav-actions" id="navActions">
        <!-- Injected via main.js -->
      </div>
    </div>
  </nav>

  <!-- Tenant Hub -->
  <main class="container dashboard-container">
    
    <div class="dashboard-header">
      <div class="dashboard-title-area">
        <h1>Tenant Living Portal</h1>
        <p>Track your signed mutual agreements, rental applications, and saved homes.</p>
      </div>

      <a href="explore.html" class="btn btn-primary">
        <i class="fa-solid fa-magnifying-glass"></i> Explore More Stays
      </a>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon teal"><i class="fa-solid fa-file-contract"></i></div>
        <div class="stat-details">
          <span class="stat-label">Active Signed Pacts</span>
          <span class="stat-value" id="statActivePacts">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon amber"><i class="fa-solid fa-paper-plane"></i></div>
        <div class="stat-details">
          <span class="stat-label">Sent Applications</span>
          <span class="stat-value" id="statActiveBookings">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon rose"><i class="fa-solid fa-heart"></i></div>
        <div class="stat-details">
          <span class="stat-label">Wishlist Properties</span>
          <span class="stat-value" id="statSavedProps">0</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="dash-tabs">
      <button class="dash-tab-btn active" id="tabBtn_pacts" onclick="switchTenantTab('pacts')">
        <i class="fa-solid fa-file-signature"></i> My Digital Pacts
      </button>
      <button class="dash-tab-btn" id="tabBtn_apps" onclick="switchTenantTab('apps')">
        <i class="fa-solid fa-paper-plane"></i> Sent Proposals & Status
      </button>
      <button class="dash-tab-btn" id="tabBtn_wishlist" onclick="switchTenantTab('wishlist')">
        <i class="fa-solid fa-heart"></i> Saved Wishlist
      </button>
    </div>

    <!-- Tab 1: Pacts -->
    <div class="tenant-tab-pane" id="tabPane_pacts">
      <div id="tenantAgreementsList">
        <!-- Injected via tenant.js -->
      </div>
    </div>

    <!-- Tab 2: Applications -->
    <div class="tenant-tab-pane" id="tabPane_apps" style="display: none;">
      <div id="tenantBookingsList">
        <!-- Injected via tenant.js -->
      </div>
    </div>

    <!-- Tab 3: Wishlist -->
    <div class="tenant-tab-pane" id="tabPane_wishlist" style="display: none;">
      <div class="property-grid" id="tenantWishlistGrid">
        <!-- Injected via tenant.js -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tenant.js"></script>
</body>
</html>
